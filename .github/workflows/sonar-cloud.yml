name: SonarCloud
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/**
      - topic/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SONAR_PROJECT_KEY: "Gibbs-Morris_alfreds-forge"
  SONAR_ORGANIZATION: "gibbs-morris"
  SONAR_HOST_URL: "https://sonarcloud.io"
  SONAR_COVERAGE_EXCLUSIONS: "src/Workbench.Client/Program.cs,src/Workbench.Client/App.razor,src/Workbench.Client/Layout/MainLayout.razor,src/Workbench.Gateway/Program.cs,src/Workbench.Runtime/Program.cs,src/Workbench.AppHost/Program.cs"
  CONFIGURATION: Release
  SOLUTION_PATH: ${{ github.workspace }}/alfreds-forge.slnx

jobs:
  Build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache GitVersion tools
        uses: actions/cache@v4
        with:
          path: ~/.gitversion
          key: ${{ runner.os }}-gitversion
          restore-keys: ${{ runner.os }}-gitversion

      - name: Cache nugets
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json') }}

      - name: Cache Sonar Cloud Cache
        uses: actions/cache@v4
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Cache Sonar Cloud Scanner
        uses: actions/cache@v4
        with:
          path: ~/sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: |
            ${{ runner.os }}-sonar-scanner

      - name: Setup Java for Sonar Scanner
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Restore dotnet tools & packages
        run: |
          dotnet tool restore

      - name: Determine Version
        id: gitversion
        shell: bash
        run: |
          semver=$(dotnet tool run dotnet-gitversion /showvariable SemVer)
          echo "SemVer=$semver" >> "$GITHUB_OUTPUT"

      - name: Sonar restore-build-report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECT_KEY }}" /o:"${{ env.SONAR_ORGANIZATION }}" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /v:${{ steps.gitversion.outputs.SemVer }} /d:"sonar.cs.vscoveragexml.reportsPaths=coverage.xml" /d:sonar.exclusions="**/*.lock.json, **/*.DotSettings,**/packages.lock.json,docs/**" /d:sonar.coverage.exclusions="${{ env.SONAR_COVERAGE_EXCLUSIONS }}"
          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-restore --no-incremental -warnaserror -p:Version=${{ steps.gitversion.outputs.SemVer }}
          dotnet tool run dotnet-coverage collect "dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} -p:Version=${{ steps.gitversion.outputs.SemVer }} --no-restore --no-build --verbosity normal --filter \"FullyQualifiedName~.L0Tests.|FullyQualifiedName~.L1Tests.\"" -f xml -o "coverage.xml"
          dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
